[package]
name = "artheffect-host"
description = "Builds a fully wired Artheffect session: media decoding (FilmCraft codecs), importer, the expression engine and scripting"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
artheffect-engine = { workspace = true }
artheffect-project = { workspace = true }
log = { workspace = true }
artheffect-media = { workspace = true }
artheffect-expr = { workspace = true }
artheffect-script = { workspace = true }
artheffect-export = { workspace = true }
artheffect-plugin = { workspace = true }

# WebAssembly effect plug-ins run in wasmi on native builds.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
artheffect-plugin = { workspace = true, features = ["wasm"] }

[dev-dependencies]
serde_json = { workspace = true }
artheffect-psd = { workspace = true }
artheffect-svg = { workspace = true }
artheffect-pdf = { workspace = true }
artheffect-raster = { workspace = true }
artheffect-time = { workspace = true }
artheffect-interchange = { workspace = true }
image = { workspace = true }
gif = { workspace = true }
exr = { workspace = true }
rayon = { workspace = true }
