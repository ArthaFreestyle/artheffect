[package]
name = "artheffect-render"
description = "The CPU compositor: property evaluation, layer sources (solids, footage, text, shapes, precomps), masks, effects, track mattes, 2D/3D transforms, motion blur and blending"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
artheffect-time = { workspace = true }
artheffect-geom = { workspace = true }
artheffect-color = { workspace = true }
artheffect-keyframe = { workspace = true }
artheffect-project = { workspace = true }
artheffect-raster = { workspace = true }
artheffect-path = { workspace = true }
artheffect-text = { workspace = true }
artheffect-effects = { workspace = true }
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
artheffect-model = { workspace = true }
kurbo = { workspace = true }
rayon = { workspace = true }
web-time = { workspace = true }
serde = { workspace = true }
log = { workspace = true }
