[package]
name = "artheffect-expr"
description = "After Effects-compatible expressions: a boa JavaScript runtime with the AE object model (thisComp, thisLayer, wiggle, loopOut, valueAtTime…) and array maths"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
artheffect-time = { workspace = true }
artheffect-geom = { workspace = true }
artheffect-keyframe = { workspace = true }
serde_json = { workspace = true }
artheffect-project = { workspace = true }
artheffect-path = { workspace = true }
artheffect-render = { workspace = true }
boa_engine = { workspace = true }

# On the web, boa's clock and Math.random need the browser (getrandom `wasm_js`, web-time).
[target.'cfg(target_arch = "wasm32")'.dependencies]
boa_engine = { workspace = true, features = ["js"] }

[dev-dependencies]
artheffect-color = { workspace = true }
artheffect-effects = { workspace = true }
artheffect-text = { workspace = true }
